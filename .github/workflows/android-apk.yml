name: Build Android APK (free, on GitHub runners)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to attach the APK to a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Decode signing key (if you added the secrets)
        env:
          KS_B64: ${{ secrets.DAYZO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "DAYZO_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "DAYZO_KEYSTORE_PASSWORD=${{ secrets.DAYZO_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "DAYZO_KEY_ALIAS=${{ secrets.DAYZO_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "DAYZO_KEY_PASSWORD=${{ secrets.DAYZO_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets found. Building with the debug key. Add the secrets before sharing the APK widely."
          fi
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (arm64 + armv7)
        working-directory: android
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' gradle.properties
          ./gradlew assembleRelease --no-daemon -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease -Dorg.gradle.jvmargs="-Xmx3g"
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk dayzo-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dayzo-apk
          path: dayzo-*.apk
      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dayzo-*.apk
          generate_release_notes: true
